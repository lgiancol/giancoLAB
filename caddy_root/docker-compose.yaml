services:
  caddy:
    image: caddy:2
    container_name: caddy_root
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/appdata/caddy/data:/data
      - /srv/appdata/caddy/config:/config

    networks:
      - web

networks:
  web:
    external: true
