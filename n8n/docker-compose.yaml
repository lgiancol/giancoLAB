services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https  
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_SECURE_COOKIE=false # We do not expose this port externally so I need to be able to connect to the webui from IP
    volumes:
      - n8n_data:/home/node/.n8n
      - /srv/storage/n8n:/files
    networks:
      - giancolab_internal

volumes:
  n8n_data:

networks:
  giancolab_internal:
    external: true
