    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.lucasgiancola.io
      WEBSOCKET_ENABLED: 'true'
      SIGNUPS_ALLOWED: 'false' # Change to true if you want open registration
      ADMIN_TOKEN: 'IgyBHJGUkSQRZKnIJPE7JUzPS4DYtyvT36Bv+WfFwF0I4yeWuec3f/iVcAO1DXNM'

      SSO_SIGNUPS_MATCH_EMAIL: "true"
      
      SSO_ENABLED: "true"
      SSO_ONLY: "false"

      SSO_AUTHORITY: https://auth.lucasgiancola.io/application/o/vaultwarden/
      SSO_SCOPES: "openid profile email offline_access"

      SSO_CLIENT_ID: V6JvPw1iIcg24S3ed2iWSJSBIBkjipGlj3vFcCev
      SSO_CLIENT_SECRET: RLlpTUu0nbXOOMxHJHNZ6JHBSMjehuSJhfqXajYEtt6Nw8iQST29EQcjsVLbFh7CGeZQtg8Z7Js0MFUDsrM23kIfk7TsmrkvixptcYLV2Fhl5An920FZg5tFo1J05XwK
